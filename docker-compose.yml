version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nabungo-app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - nabungo

  web:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nabungo

networks:
  nabungo:
    driver: bridge
